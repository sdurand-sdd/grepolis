name: Mise à jour des données Grepolis

on:
  schedule:
    # Deux passages par jour, à des minutes "creuses" (GitHub retarde ou saute
    # souvent les exécutions pile à l'heure). Heures UTC : 03:23 et 05:23,
    # soit environ 04:23 et 06:23 en hiver (heure de Paris).
    - cron: '23 3 * * *'
    - cron: '23 5 * * *'
    - cron: '15 7 * * *'
  # Permet aussi de le lancer à la main (bouton "Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger et vérifier les 4 fichiers
        run: |
          set -euo pipefail
          WORLD="fr39"
          mkdir -p /tmp/new
          for f in alliances players towns islands; do
            curl -fsS --retry 3 --retry-delay 10 \
              -A "Mozilla/5.0 (compatible; grepolis-data-updater)" \
              -o "/tmp/new/$f.txt" "https://$WORLD.grepolis.com/data/$f.txt"
            new=$(wc -l < "/tmp/new/$f.txt")
            if [ "$new" -eq 0 ]; then
              echo "::error::$f.txt téléchargé est vide, aucune mise à jour"
              exit 1
            fi
            if [ -f "$f.txt" ]; then
              old=$(wc -l < "$f.txt")
              if [ "$new" -lt $((old / 2)) ]; then
                echo "::error::$f.txt téléchargé a $new lignes contre $old actuellement, aucune mise à jour"
                exit 1
              fi
            fi
            echo "$f.txt : $new lignes"
          done
          # Les 4 fichiers sont copiés seulement si tous sont valides
          cp /tmp/new/*.txt .

      - name: Mettre à jour last_update.txt et publier
        run: |
          TZ=Europe/Paris date '+%d/%m/%Y %H:%M:%S' > last_update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alliances.txt players.txt towns.txt islands.txt last_update.txt
          if git diff --cached --quiet; then
            echo "Rien à publier"
          else
            git commit -m "Mise à jour automatique des données"
            git push
          fi
